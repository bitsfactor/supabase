# Patroni 配置模板(美元符占位由 render.py 用环境变量替换)。
# 租约 30 秒、每 10 秒续一次;wal_log_hints 开(pg_rewind 需要);同步提交;回调只写日志。
scope: "$PT_SCOPE"
namespace: /one/
name: "$PT_NAME"

# REST 口:TLS + 必须出示同一 CA 签发的客户端证书(verify_client: required),写类请求(切换 / 改配置)另需口令。
# 证书由 tls/gen-certs.sh 生成,挂在 /tls,入口脚本拷到 /etc/patroni/tls。
restapi:
  listen: 0.0.0.0:8008
  connect_address: "$PT_HOST:$PT_REST_PORT"
  certfile: /etc/patroni/tls/node.crt
  keyfile: /etc/patroni/tls/node.key
  cafile: /etc/patroni/tls/ca.crt
  verify_client: required
  authentication:
    username: patroni
    password: "$PT_REST_PASSWORD"

# patronictl 与 Patroni 成员之间互调 REST 用的客户端材料
ctl:
  insecure: false
  cacert: /etc/patroni/tls/ca.crt
  certfile: /etc/patroni/tls/node.crt
  keyfile: /etc/patroni/tls/node.key
  authentication:
    username: patroni
    password: "$PT_REST_PASSWORD"

# etcd:双向 TLS(同一个私有 CA 签发的节点证书),不开 etcd 用户认证
etcd3:
  hosts: "$PT_ETCD_HOSTS"
  protocol: https
  cacert: /etc/patroni/tls/ca.crt
  cert: /etc/patroni/tls/node.crt
  key: /etc/patroni/tls/node.key

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    # 同步提交:缺省 quorum(任一从库确认才算提交,单机故障不丢已确认的写入);迁移期(备用集群)render.py 置 false,切主时 edit-config 一并打开。
    synchronous_mode: $PT_SYNC
    synchronous_node_count: 1
    # 投票组整体不可用时保持现主;租约 30 秒 / 每 10 秒续一次。
    failsafe_mode: true
    # 复制槽:Patroni 只管自己建的;realtime 的逻辑槽(cainophile_*)配成忽略。
    ignore_slots:
      - type: logical
    postgresql:
      use_pg_rewind: true
      # 坏机回来自动变回从库:倒回失败就删掉数据目录重拷;时间线分叉也删了重拷(operator 2026-11-08 定)
      remove_data_directory_on_rewind_failure: true
      remove_data_directory_on_diverged_timelines: true
      use_slots: true
      # 下面这些是 Patroni 要求「各节点必须一致」的参数(从库值不得小于主库),全部取自环境变量、
      # 没有缺省值:生产值见 production/params.env,上线前必须与现主库 SHOW 的结果核对(production/README.md)。
      # wal_level 必须保持 logical(realtime 用逻辑复制槽)。
      parameters:
        wal_level: logical
        # 原 compose 的启动参数(realtime 轮询查询不进日志)
        log_min_messages: fatal
        wal_log_hints: "on"
        # 一台从库悄悄断网时,等待同步确认的提交最多卡这么久(默认 60 秒)。
        wal_sender_timeout: 10s
        wal_receiver_timeout: 10s
        hot_standby: "on"
        max_connections: $PT_MAX_CONNECTIONS
        max_worker_processes: $PT_MAX_WORKER_PROCESSES
        max_wal_senders: $PT_MAX_WAL_SENDERS
        max_replication_slots: $PT_MAX_REPLICATION_SLOTS
        max_prepared_transactions: $PT_MAX_PREPARED_TRANSACTIONS
        max_locks_per_transaction: $PT_MAX_LOCKS_PER_TRANSACTION
        track_commit_timestamp: "off"

postgresql:
  listen: 0.0.0.0:5432
  connect_address: "$PT_HOST:$PT_PG_PORT"
  data_dir: /var/lib/postgresql/data
  # 沿用 supabase 自带的 postgresql.conf(supautils / pg_cron / pg_net 等预加载全在里面)。
  custom_conf: /etc/postgresql/postgresql.conf
  pgpass: /tmp/pgpass
  use_unix_socket: true
  authentication:
    superuser:
      username: supabase_admin
      password: "$PT_SUPERUSER_PASSWORD"
    replication:
      username: supabase_replication_admin
      password: "$PT_REPL_PASSWORD"
  # 与镜像自带 pg_hba.conf 逐行一致,外加 replication 行(镜像自带的 all 不匹配复制连接)。
  pg_hba:
    - local all supabase_admin scram-sha-256
    - local all all peer map=supabase_map
    - host all all 127.0.0.1/32 trust
    - host all all ::1/128 trust
    - host replication supabase_replication_admin 127.0.0.1/32 trust
    - host replication supabase_replication_admin ::1/128 trust
    # 成员跨机房、走公网地址:这里放开来源,谁能连由源站防火墙(fleet_allowlist)管,pg_hba 里不列节点 IP。
    - host replication supabase_replication_admin 0.0.0.0/0 scram-sha-256
    - host replication supabase_replication_admin ::/0 scram-sha-256
    - host all all 10.0.0.0/8 scram-sha-256
    - host all all 172.16.0.0/12 scram-sha-256
    - host all all 192.168.0.0/16 scram-sha-256
    - host all all 0.0.0.0/0 scram-sha-256
    - host all all ::0/0 scram-sha-256
  pg_ident:
    - supabase_map postgres postgres
    - supabase_map root postgres
    - supabase_map ubuntu postgres
    - supabase_map gotrue supabase_auth_admin
    - supabase_map postgrest authenticator
    - supabase_map adminapi postgres
  callbacks:
    on_role_change: /opt/patroni/on-role-change.sh

tags:
  nofailover: $PT_NOFAILOVER
  noloadbalance: false
  clonefrom: false
  nosync: $PT_NOSYNC
