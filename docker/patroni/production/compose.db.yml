# 生产:把 supabase 自己 compose 里的 `db` 服务换成 Patroni 镜像。叠在 supabase 的 docker-compose.yml 上用:
#   docker compose -f docker-compose.yml -f patroni/production/compose.db.yml up -d --no-deps db
# 相对路径都按第一个 -f 文件(supabase 的 docker-compose.yml)所在目录算;/opt/patroni/{machine,params}.env 由证书包与部署带来。
# 与原 `db` 服务保持一致(同一个服务名 db = 其它 supabase 服务用的网络别名 db、container_name supabase-db、
# 同一个 PGDATA 目录、同一个 db-config 卷(里面是 pgsodium_root.key)、shm_size 16gb、发布 5433→5432、healthcheck);
# 只换镜像与启动方式,并多发布 Patroni REST 8008。数据目录不动 → 回退 = 去掉本文件再 up。
services:
  db:
    image: one-patroni:15.8.1.085-p4.1.1
    build: {context: ./patroni, dockerfile: Dockerfile}
    command: !reset []          # 基础镜像的 postgres ... 命令不用;Patroni 是 1 号进程并拉起 Postgres
    ports:
      - "8008:8008"
    volumes:
      - /opt/patroni/tls:/tls:ro
    env_file: [/opt/patroni/machine.env, /opt/patroni/params.env]
    environment:
      PT_SCOPE: supabase-main
      PT_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD}      # supabase_admin 的现有口令(supabase .env 里的 POSTGRES_PASSWORD)
      PT_REPL_PASSWORD: ${PT_REPL_PASSWORD}            # supabase_replication_admin 的口令(迁移前先在现主库设置并复制下去)
      PT_STANDBY_HOST: ${PT_STANDBY_HOST:-}            # 迁移期:跟随的旧主库地址;切主时去掉(见 drills/01-migrate.sh)
      PT_STANDBY_PORT: ${PT_STANDBY_PORT:-5433}
      PT_STANDBY_SLOT: ${PT_STANDBY_SLOT:-}
      PT_SYNC: ${PT_SYNC:-false}
      PT_NOSYNC: ${PT_NOSYNC:-false}
