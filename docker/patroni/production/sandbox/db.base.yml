# 测试环境专用:生产 supabase 的 `db` 服务的替身(旧架构库容器,原版镜像),给 compose.db.yml 当底。
# 与生产定义同形:服务名 db、数据卷 / 配置卷、restart 策略、命令行;只是名字 / 网络 / 卷名按机器名带后缀。
name: supabase-sbx
services:
  db:
    container_name: pt-${SBX_M}
    image: pt-legacy:latest
    restart: unless-stopped
    shm_size: 256m
    mem_limit: 4g
    cap_add: [NET_ADMIN]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: "5432"
      POSTGRES_PORT: "5432"
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      PGDATABASE: postgres
      JWT_SECRET: pt-jwt-secret-pt-jwt-secret-pt-jwt-secret
      JWT_EXP: "3600"
    volumes:
      - data:/var/lib/postgresql/data
      - cfg:/etc/postgresql-custom
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    networks:
      sbx:
        ipv4_address: ${SBX_DB_IP}
  # 替身的「其它服务」:验证 patroni_update_services 只动它、不重建 db(生产里是 auth / kong / storage / realtime …)
  aux:
    container_name: pt-aux-${SBX_M}
    image: pt-clients:latest
    restart: unless-stopped
    network_mode: none
    mem_limit: 64m
    command: ["sleep", "infinity"]
networks:
  sbx:
    external: true
    name: patroni-test
volumes:
  data: {external: true, name: "pt-data-${SBX_M}"}
  cfg: {external: true, name: "pt-cfg-${SBX_M}"}
