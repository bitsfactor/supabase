# 生产:每台库机器(以及纯投票机)上的投票组成员 + 库入口。部署目录 /opt/patroni,与 supabase 的 compose 分开(项目名 pt-prod),
# 所以新增它们不碰现有库容器。用法(env 文件由 tls/gen-certs.sh 生成,随证书包一起装到机器上):
#   docker compose -p pt-prod -f compose.entry.yml --env-file /opt/patroni/machine.env --env-file /opt/patroni/params.env --profile etcd up -d etcd
#   docker compose -p pt-prod -f compose.entry.yml --env-file /opt/patroni/machine.env --env-file /opt/patroni/params.env --profile entry up -d ha
# 端口全部发布在宿主(走 docker 的 DNAT),源站防火墙同步按「docker 实际发布的端口」自动覆盖(见 README「防火墙」)。
# 库入口模式由本容器的 HA_MODE 决定,切换 = 改 env 后 `up -d --force-recreate ha`,不做热重载:
#   HA_MODE=static  + HA_STATIC=<名>=<现主 IP>:5433   迁移前:固定转给现主库(此时 Patroni 还没装)
#   HA_MODE=patroni(缺省)                                 查每个成员 Patroni REST 的 /primary(HTTPS + 客户端证书)
name: pt-prod
services:
  etcd:
    profiles: [etcd]
    image: quay.io/coreos/etcd:v3.5.17
    container_name: pt-etcd
    restart: unless-stopped
    ports: ["2379:2379", "2380:2380"]
    volumes:
      - /opt/patroni/tls:/tls:ro
      - pt-etcd-data:/data
    mem_limit: 512m
    # 灾后恢复(supabase.patroni_etcd_recover)用:幸存成员单独重建投票组;平时恒为 false。
    environment:
      ETCD_FORCE_NEW_CLUSTER: "${ETCD_FORCE_NEW_CLUSTER:-false}"
    command:
      - etcd
      - --name=${ETCD_NAME}
      - --data-dir=/data
      - --listen-client-urls=https://0.0.0.0:2379
      - --advertise-client-urls=https://${ETCD_IP}:2379
      - --listen-peer-urls=https://0.0.0.0:2380
      - --initial-advertise-peer-urls=https://${ETCD_IP}:2380
      - --initial-cluster-token=one-patroni
      - --initial-cluster=${ETCD_INITIAL_CLUSTER}
      - --initial-cluster-state=${ETCD_INITIAL_CLUSTER_STATE:-new}
      - --cert-file=/tls/etcd.crt
      - --key-file=/tls/etcd.key
      - --trusted-ca-file=/tls/ca.crt
      - --client-cert-auth
      - --peer-cert-file=/tls/etcd.crt
      - --peer-key-file=/tls/etcd.key
      - --peer-trusted-ca-file=/tls/ca.crt
      - --peer-client-cert-auth
      # 跨洲 ~65ms 往返:心跳 ≥ 最大往返,选举超时 ≥ 10 倍心跳(演练实测值)
      - --heartbeat-interval=200
      - --election-timeout=2000
      - --auto-compaction-mode=periodic
      - --auto-compaction-retention=1h
  ha:
    profiles: [entry]
    build: {context: .., dockerfile: Dockerfile.haproxy}
    image: one-patroni-haproxy:2.8
    container_name: pt-ha
    restart: unless-stopped
    ports: ["5000:5000"]
    volumes: ["/opt/patroni/tls:/tls:ro"]
    mem_limit: 256m
    environment:
      ENTRY_PORT: "5000"
      HA_MODE: "${HA_MODE:-patroni}"
      HA_STATIC: "${HA_STATIC:-}"
      HA_NODES: "${HA_NODES:-}"
volumes:
  pt-etcd-data:
