# 测试环境(colima profile patroni-test / 测试节点)的 Patroni 集群:5 个 etcd(TLS + 认证)+ 3 个库 + 3 个库入口。
# 生产里 us-los2 不进 Patroni,所以库只有 ny1 / mia / los;投票机 5 个 = ny1 / mia / los + 两台洛杉矶以外的 x / x2。
# 前置:drills/lib.sh 已建网络 pt-net、卷 pt-data-<节点>(PGDATA,先由「旧架构」建好)与 pt-cfg-<节点>,
# 并由 drills/tls-init.sh 生成证书到 $PT_TLS(machines/<名>/tls)。etcd 的参数与 production/compose.entry.yml 一致。
# 用法:drills/lib.sh 里的 pt_compose;单个服务按名字起停,不整体 down。
name: pt
networks:
  pt-net:
    external: true
    name: patroni-test
volumes:
  pt-data-ny1:
    external: true
  pt-cfg-ny1:
    external: true
  pt-data-mia:
    external: true
  pt-cfg-mia:
    external: true
  pt-data-los:
    external: true
  pt-cfg-los:
    external: true

x-etcd: &etcd
  image: quay.io/coreos/etcd:v3.5.17
  restart: unless-stopped
  cap_add: [NET_ADMIN]
  mem_limit: 256m
x-db-env: &dbenv
  PT_SCOPE: supabase-main
  PT_ETCD_HOSTS: "10.77.0.11:2379,10.77.0.75:2379,10.77.0.139:2379,10.77.0.203:2379,10.77.0.204:2379"
  PT_PG_PORT: "5433"
  PT_REST_PORT: "8008"
  PT_MAX_CONNECTIONS: "${PT_MAX_CONNECTIONS}"
  PT_MAX_WAL_SENDERS: "${PT_MAX_WAL_SENDERS}"
  PT_MAX_REPLICATION_SLOTS: "${PT_MAX_REPLICATION_SLOTS}"
  PT_MAX_WORKER_PROCESSES: "${PT_MAX_WORKER_PROCESSES}"
  PT_MAX_LOCKS_PER_TRANSACTION: "${PT_MAX_LOCKS_PER_TRANSACTION}"
  PT_MAX_PREPARED_TRANSACTIONS: "${PT_MAX_PREPARED_TRANSACTIONS}"
  PT_TEST_PG_REDIRECT: "5433"
  ETCD_PATRONI_PASSWORD: "${ETCD_PATRONI_PASSWORD}"
  PT_REST_PASSWORD: "${PT_REST_PASSWORD}"
  PT_SUPERUSER_PASSWORD: "${PT_PW:-pt-test-password}"
  PT_REPL_PASSWORD: "${PT_PW:-pt-test-password}"
  PT_STANDBY_HOST: "${PT_STANDBY_HOST:-}"
  PT_STANDBY_PORT: "5433"
  PT_STANDBY_SLOT: "${PT_STANDBY_SLOT:-}"
  PT_SYNC: "${PT_SYNC:-false}"
x-ha-env: &haenv
  HA_NODES: "ny1=10.77.0.21:5433:8008,mia=10.77.0.85:5433:8008,los=10.77.0.149:5433:8008"
  ENTRY_PORT: "5000"
  # 模式由容器自己的环境决定;切模式 = 重建入口容器(--force-recreate),不做热重载
  HA_MODE: "${HA_MODE:-patroni}"
  HA_STATIC: "${HA_STATIC:-}"
services:
  etcd-ny1:
    <<: *etcd
    container_name: pt-etcd-ny1
    networks: {pt-net: {ipv4_address: 10.77.0.11}}
    volumes: ["${PT_TLS}/machines/ny1/tls:/tls:ro"]
    command:
      - etcd
      - --name=etcd-ny1
      - --data-dir=/data
      - --listen-client-urls=https://0.0.0.0:2379
      - --advertise-client-urls=https://10.77.0.11:2379
      - --listen-peer-urls=https://0.0.0.0:2380
      - --initial-advertise-peer-urls=https://10.77.0.11:2380
      - --initial-cluster-token=pt
      - --initial-cluster=etcd-ny1=https://10.77.0.11:2380,etcd-mia=https://10.77.0.75:2380,etcd-los=https://10.77.0.139:2380,etcd-x=https://10.77.0.203:2380,etcd-x2=https://10.77.0.204:2380
      - --initial-cluster-state=new
      # 客户端与成员间都是 TLS + 必须出示同一 CA 签发的证书
      - --cert-file=/tls/etcd.crt
      - --key-file=/tls/etcd.key
      - --trusted-ca-file=/tls/ca.crt
      - --client-cert-auth
      - --peer-cert-file=/tls/etcd.crt
      - --peer-key-file=/tls/etcd.key
      - --peer-trusted-ca-file=/tls/ca.crt
      - --peer-client-cert-auth
      # 跨洲 ~65ms 往返:心跳 ≥ 最大往返,选举超时 ≥ 10 倍心跳。
      - --heartbeat-interval=200
      - --election-timeout=2000
      - --auto-compaction-mode=periodic
      - --auto-compaction-retention=1h
  etcd-mia:
    <<: *etcd
    container_name: pt-etcd-mia
    networks: {pt-net: {ipv4_address: 10.77.0.75}}
    volumes: ["${PT_TLS}/machines/mia/tls:/tls:ro"]
    command:
      - etcd
      - --name=etcd-mia
      - --data-dir=/data
      - --listen-client-urls=https://0.0.0.0:2379
      - --advertise-client-urls=https://10.77.0.75:2379
      - --listen-peer-urls=https://0.0.0.0:2380
      - --initial-advertise-peer-urls=https://10.77.0.75:2380
      - --initial-cluster-token=pt
      - --initial-cluster=etcd-ny1=https://10.77.0.11:2380,etcd-mia=https://10.77.0.75:2380,etcd-los=https://10.77.0.139:2380,etcd-x=https://10.77.0.203:2380,etcd-x2=https://10.77.0.204:2380
      - --initial-cluster-state=new
      # 客户端与成员间都是 TLS + 必须出示同一 CA 签发的证书
      - --cert-file=/tls/etcd.crt
      - --key-file=/tls/etcd.key
      - --trusted-ca-file=/tls/ca.crt
      - --client-cert-auth
      - --peer-cert-file=/tls/etcd.crt
      - --peer-key-file=/tls/etcd.key
      - --peer-trusted-ca-file=/tls/ca.crt
      - --peer-client-cert-auth
      # 跨洲 ~65ms 往返:心跳 ≥ 最大往返,选举超时 ≥ 10 倍心跳。
      - --heartbeat-interval=200
      - --election-timeout=2000
      - --auto-compaction-mode=periodic
      - --auto-compaction-retention=1h
  etcd-los:
    <<: *etcd
    container_name: pt-etcd-los
    networks: {pt-net: {ipv4_address: 10.77.0.139}}
    volumes: ["${PT_TLS}/machines/los/tls:/tls:ro"]
    command:
      - etcd
      - --name=etcd-los
      - --data-dir=/data
      - --listen-client-urls=https://0.0.0.0:2379
      - --advertise-client-urls=https://10.77.0.139:2379
      - --listen-peer-urls=https://0.0.0.0:2380
      - --initial-advertise-peer-urls=https://10.77.0.139:2380
      - --initial-cluster-token=pt
      - --initial-cluster=etcd-ny1=https://10.77.0.11:2380,etcd-mia=https://10.77.0.75:2380,etcd-los=https://10.77.0.139:2380,etcd-x=https://10.77.0.203:2380,etcd-x2=https://10.77.0.204:2380
      - --initial-cluster-state=new
      # 客户端与成员间都是 TLS + 必须出示同一 CA 签发的证书
      - --cert-file=/tls/etcd.crt
      - --key-file=/tls/etcd.key
      - --trusted-ca-file=/tls/ca.crt
      - --client-cert-auth
      - --peer-cert-file=/tls/etcd.crt
      - --peer-key-file=/tls/etcd.key
      - --peer-trusted-ca-file=/tls/ca.crt
      - --peer-client-cert-auth
      # 跨洲 ~65ms 往返:心跳 ≥ 最大往返,选举超时 ≥ 10 倍心跳。
      - --heartbeat-interval=200
      - --election-timeout=2000
      - --auto-compaction-mode=periodic
      - --auto-compaction-retention=1h
  etcd-x:
    <<: *etcd
    container_name: pt-etcd-x
    networks: {pt-net: {ipv4_address: 10.77.0.203}}
    volumes: ["${PT_TLS}/machines/x/tls:/tls:ro"]
    command:
      - etcd
      - --name=etcd-x
      - --data-dir=/data
      - --listen-client-urls=https://0.0.0.0:2379
      - --advertise-client-urls=https://10.77.0.203:2379
      - --listen-peer-urls=https://0.0.0.0:2380
      - --initial-advertise-peer-urls=https://10.77.0.203:2380
      - --initial-cluster-token=pt
      - --initial-cluster=etcd-ny1=https://10.77.0.11:2380,etcd-mia=https://10.77.0.75:2380,etcd-los=https://10.77.0.139:2380,etcd-x=https://10.77.0.203:2380,etcd-x2=https://10.77.0.204:2380
      - --initial-cluster-state=new
      # 客户端与成员间都是 TLS + 必须出示同一 CA 签发的证书
      - --cert-file=/tls/etcd.crt
      - --key-file=/tls/etcd.key
      - --trusted-ca-file=/tls/ca.crt
      - --client-cert-auth
      - --peer-cert-file=/tls/etcd.crt
      - --peer-key-file=/tls/etcd.key
      - --peer-trusted-ca-file=/tls/ca.crt
      - --peer-client-cert-auth
      # 跨洲 ~65ms 往返:心跳 ≥ 最大往返,选举超时 ≥ 10 倍心跳。
      - --heartbeat-interval=200
      - --election-timeout=2000
      - --auto-compaction-mode=periodic
      - --auto-compaction-retention=1h
  etcd-x2:
    <<: *etcd
    container_name: pt-etcd-x2
    networks: {pt-net: {ipv4_address: 10.77.0.204}}
    volumes: ["${PT_TLS}/machines/x2/tls:/tls:ro"]
    command:
      - etcd
      - --name=etcd-x2
      - --data-dir=/data
      - --listen-client-urls=https://0.0.0.0:2379
      - --advertise-client-urls=https://10.77.0.204:2379
      - --listen-peer-urls=https://0.0.0.0:2380
      - --initial-advertise-peer-urls=https://10.77.0.204:2380
      - --initial-cluster-token=pt
      - --initial-cluster=etcd-ny1=https://10.77.0.11:2380,etcd-mia=https://10.77.0.75:2380,etcd-los=https://10.77.0.139:2380,etcd-x=https://10.77.0.203:2380,etcd-x2=https://10.77.0.204:2380
      - --initial-cluster-state=new
      # 客户端与成员间都是 TLS + 必须出示同一 CA 签发的证书
      - --cert-file=/tls/etcd.crt
      - --key-file=/tls/etcd.key
      - --trusted-ca-file=/tls/ca.crt
      - --client-cert-auth
      - --peer-cert-file=/tls/etcd.crt
      - --peer-key-file=/tls/etcd.key
      - --peer-trusted-ca-file=/tls/ca.crt
      - --peer-client-cert-auth
      # 跨洲 ~65ms 往返:心跳 ≥ 最大往返,选举超时 ≥ 10 倍心跳。
      - --heartbeat-interval=200
      - --election-timeout=2000
      - --auto-compaction-mode=periodic
      - --auto-compaction-retention=1h
  db-ny1:
    image: pt-patroni:latest
    container_name: pt-ny1
    restart: unless-stopped
    networks: {pt-net: {ipv4_address: 10.77.0.21}}
    cap_add: [NET_ADMIN]
    shm_size: 16gb
    mem_limit: 4g
    environment:
      <<: *dbenv
      PT_NAME: ny1
      PT_HOST: 10.77.0.21
      PT_NOSYNC: "false"
    volumes:
      - pt-data-ny1:/var/lib/postgresql/data
      - pt-cfg-ny1:/etc/postgresql-custom
      - ${PT_TLS}/machines/ny1/tls:/tls:ro
  ha-ny1:
    image: pt-haproxy:latest
    container_name: pt-ha-ny1
    restart: unless-stopped
    networks: {pt-net: {ipv4_address: 10.77.0.22}}
    cap_add: [NET_ADMIN]
    mem_limit: 128m
    environment:
      <<: *haenv
    volumes:
      - ${PT_TLS}/machines/ny1/tls:/tls:ro
  db-mia:
    image: pt-patroni:latest
    container_name: pt-mia
    restart: unless-stopped
    networks: {pt-net: {ipv4_address: 10.77.0.85}}
    cap_add: [NET_ADMIN]
    shm_size: 16gb
    mem_limit: 4g
    environment:
      <<: *dbenv
      PT_NAME: mia
      PT_HOST: 10.77.0.85
      PT_NOSYNC: "false"
    volumes:
      - pt-data-mia:/var/lib/postgresql/data
      - pt-cfg-mia:/etc/postgresql-custom
      - ${PT_TLS}/machines/mia/tls:/tls:ro
  ha-mia:
    image: pt-haproxy:latest
    container_name: pt-ha-mia
    restart: unless-stopped
    networks: {pt-net: {ipv4_address: 10.77.0.86}}
    cap_add: [NET_ADMIN]
    mem_limit: 128m
    environment:
      <<: *haenv
    volumes:
      - ${PT_TLS}/machines/mia/tls:/tls:ro
  db-los:
    image: pt-patroni:latest
    container_name: pt-los
    restart: unless-stopped
    networks: {pt-net: {ipv4_address: 10.77.0.149}}
    cap_add: [NET_ADMIN]
    shm_size: 16gb
    mem_limit: 4g
    environment:
      <<: *dbenv
      PT_NAME: los
      PT_HOST: 10.77.0.149
      # 3 台库时 los 也是同步候选(任一台确认即可);原 4 库拓扑里 los 标 nosync 是因为还有 los2
      PT_NOSYNC: "false"
    volumes:
      - pt-data-los:/var/lib/postgresql/data
      - pt-cfg-los:/etc/postgresql-custom
      - ${PT_TLS}/machines/los/tls:/tls:ro
  ha-los:
    image: pt-haproxy:latest
    container_name: pt-ha-los
    restart: unless-stopped
    networks: {pt-net: {ipv4_address: 10.77.0.150}}
    cap_add: [NET_ADMIN]
    mem_limit: 128m
    environment:
      <<: *haenv
    volumes:
      - ${PT_TLS}/machines/los/tls:/tls:ro
